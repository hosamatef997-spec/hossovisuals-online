<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جرّب أصوات الزراير · HOSSO</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0F1B33;color:#F4EFE6;font-family:system-ui,'Segoe UI',Tahoma,sans-serif}
h1{font-size:28px;margin:0 0 6px}p{opacity:.7;margin:0 0 14px}
button{font:700 22px system-ui,Tahoma,sans-serif;width:280px;padding:18px;border-radius:999px;border:0;cursor:pointer;background:rgba(244,239,230,.12);color:#F4EFE6;transition:transform .08s}
button.main{background:#D8B878;color:#0F1B33}button:active{transform:scale(.94)}
</style></head><body>
<h1>دوس على أي زرار 🔊</h1><p>الصوت معمول بالكود، من غير ولا ملف صوت</p>
<button class="main" data-f="880">احجز دلوقتي</button>
<button data-f="660">القايمة</button>
<button data-f="520">تواصل معانا</button>
<script>
// Web Audio API: a short soft "tick" per button (oscillator + fast fade). The sound starts only after a click (browser rule).
let ctx;
function tick(freq){
  ctx = ctx || new AudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain(), t = ctx.currentTime;
  osc.type = "sine"; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.13);
}
document.querySelectorAll("button").forEach(b => b.addEventListener("click", () => tick(+b.dataset.f)));
</script></body></html>
